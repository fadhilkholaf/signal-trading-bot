[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-only-crypto-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["ccxt>=4.4.0", "numpy>=1.26", "pandas>=2.2", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

